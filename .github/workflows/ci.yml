name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: PHP ${{ matrix.php }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        php: ['8.2', '8.3', '8.4', '8.5']
        include:
          - os: windows-latest
            php: '8.4'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json, openssl
          coverage: pcov
          tools: composer:v2
      - name: Install
        run: composer update --no-interaction --no-progress --prefer-dist
      - name: Tests with coverage (fails below 90 % of lines)
        run: composer coverage

  lowest:
    name: Lowest dependencies (PHP 8.2)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.2'
          extensions: curl, json, openssl
          coverage: none
          tools: composer:v2
      - name: Install the lowest allowed versions
        run: composer update --prefer-lowest --prefer-stable --no-interaction --no-progress --prefer-dist
      - name: Tests
        run: composer test

  quality:
    name: Static analysis, code style, audit, package (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json, openssl
          coverage: none
          tools: composer:v2
      - name: Validate composer.json
        run: composer validate --strict
      - name: Install
        run: composer update --no-interaction --no-progress --prefer-dist
      - name: PHPStan (level max, strict rules)
        run: composer analyse
      - name: Code style (PER-CS 2.0)
        run: composer cs
      - name: Vulnerability audit
        run: composer audit
      - name: Package contents (only src/ and docs)
        run: |
          git archive --format=tar HEAD | tar -t | sort | tee package-files.txt
          if grep -vE '^(src/.*|composer\.json|LICENSE|(README|README\.ru|CHANGELOG|SECURITY)\.md)$' package-files.txt; then
            echo "::error::unexpected files in the package"
            exit 1
          fi
